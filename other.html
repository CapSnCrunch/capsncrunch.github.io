<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Samuel Perales | Other</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K4LP8WXGLP"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-K4LP8WXGLP');
    </script>
  </head>
  <body>
    <div id="header">
      <h1 style="text-align: center; margin-bottom: 10px">
        <a class="name" href="index.html">Samuel Perales</a>
      </h1>
      <h2 style="text-align: center; margin-top: 0">Personal Blog</h2>
    </div>
    <div id="topbar">
      <div style="display: flex">
        <a href="index.html">Home</a>
        <a href="articles.html">Articles</a>
        <a href="projects.html">Projects</a>
        <a href="other.html"><strong>Other</strong></a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <div class="content" style="margin-bottom: 40px; margin-top: 20px;">
      <div style="text-align: center; margin: 20px">
        <h3>
          This is where I house my lists-of-things and whatever else seems
          reasonable to put here. My web applications, artwork and other
          projects live on the <a href="projects.html">Projects</a> page.
        </h3>
      </div>
      <div style="margin: 0 10px">
        <div id="apps" style="display: grid; width: 100%"></div>
      </div>
    </div>

    <script>
      const sections = [
        {
          title: "My Reading Log",
          description: "A running list of books I've read.",
          date: "(6 / 15 / 22)",
          link: "other/book-list.html"
        },
        {
          title: "Certifications",
          description: "List of technical certifications I've received and the notes I used to prep for them.",
          date: "(5 / 15 / 23)",
          link: "other/certifications.html"
        },
        {
          title: "Website List",
          description: "Some websites I like.",
          date: "(9 / 5 / 25)",
          link: "other/website-list.html"
        },
        // {
        //   title: "Drawings",
        //   description: "A collection of drawings I've done.",
        //   date: "(3 / 30 / 25)",
        //   link: "other/drawings.html"
        // },
        // {
        //   title: "Course Notes",
        //   description: "My handwritten / typed university course notes.",
        //   date: "(4 / 10 / 25)",
        //   link: "other/course-notes.html"
        // }
      ];

      const appsDiv = document.getElementById("apps");

      sections.forEach((section) => {
        const sectionDiv = document.createElement("div");
        sectionDiv.onclick = () => {
          location.href = section.link;
        };

        const titleHeading = document.createElement("h3");
        titleHeading.innerHTML = `<strong>${section.title}</strong>`;
        sectionDiv.appendChild(titleHeading);

        const descriptionHeading = document.createElement("h4");
        descriptionHeading.textContent = section.description;
        sectionDiv.appendChild(descriptionHeading);

        const dateHeading = document.createElement("h4");
        dateHeading.innerHTML = `<strong>${section.date}</strong>`;
        sectionDiv.appendChild(dateHeading);

        appsDiv.appendChild(sectionDiv);
      });
    </script>
  </body>
</html>

<style>
  @media only screen and (max-width: 600px) {
    #apps {
      grid-template-columns: 1fr;
    }
  }

  @media only screen and (min-width: 601px) and (max-width: 960px) {
    #apps {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media only screen and (min-width: 961px) {
    #apps {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }
</style>
