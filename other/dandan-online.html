    <style>
      /* Ported from the Dandân Online navbar (Dashboard.jsx / index.css):
         EB Garamond display font, blue gradient text, and the koi-fish glow. */
      .dandan-wordmark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        -webkit-user-select: none;
        user-select: none;
        transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .dandan-fish {
        height: 88px;
        width: auto;
        filter: drop-shadow(0 0 6px rgba(100, 200, 255, 0.4));
        pointer-events: none;
        -webkit-user-drag: none;
      }
      .dandan-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        margin: 0 -6px;
        font-family: "EB Garamond", Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      .dandan-title {
        font-size: 54px;
        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #818cf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .dandan-sub {
        font-size: 34px;
        background: linear-gradient(135deg, #87CEEB 0%, #64C8FF 50%, #4AB8FF 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @media (hover: hover) and (pointer: fine) {
        .dandan-wordmark:hover { transform: scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dandan-wordmark { transition: none; }
      }
      @media only screen and (max-width: 600px) {
        .dandan-fish { height: 58px; }
        .dandan-title { font-size: 36px; }
        .dandan-sub { font-size: 23px; }
      }
    </style>
